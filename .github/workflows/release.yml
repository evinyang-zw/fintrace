name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: fintrace:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (block HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fintrace:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          image: fintrace:${{ github.sha }}
          format: spdx-json
          artifact-name: fintrace-sbom.spdx.json

      - name: Push
        run: |
          docker tag fintrace:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker tag fintrace:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      # The server cannot pull from GHCR fast enough; a plain artifact is the
      # reliable fallback. It is also the rollback kit if the registry is down.
      - name: Export image artifact (offline deploy)
        run: |
          docker save fintrace:${{ github.sha }} | gzip -1 > /tmp/fintrace-image.tar.gz
          ls -lh /tmp/fintrace-image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: fintrace-image-amd64
          path: /tmp/fintrace-image.tar.gz
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: deploy/compose.prod.yml
          target: /opt/fintrace/
          strip_components: 0

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/fintrace
            export IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}
            docker compose --env-file .env -f deploy/compose.prod.yml pull app mcp
            docker compose --env-file .env -f deploy/compose.prod.yml up -d --remove-orphans
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1/api/health >/dev/null; then
                echo "healthy after ${i} checks"
                exit 0
              fi
              sleep 2
            done
            echo "health check failed" >&2
            docker compose -f deploy/compose.prod.yml logs --tail=80 app mcp >&2 || true
            exit 1
