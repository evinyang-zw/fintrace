name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: fintrace
          POSTGRES_PASSWORD: fintrace
          POSTGRES_DB: fintrace
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U fintrace -d fintrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fintrace:fintrace@localhost:5433/fintrace
      SEC_USER_AGENT: "FinTrace CI ci@example.com"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest -m "not live" --cov --cov-report=term-missing --cov-fail-under=70

      - name: Config sanity (pricing table)
        run: uv run python -m agent.pricing

      - name: Seed fixture warehouse
        run: |
          uv run python -c "from pipelines.db import init_schema; from pipelines.config import Settings; init_schema(Settings.from_env().database_url)"
          uv run python -m pipelines.fixtures

      - name: Eval gate (replay, no network)
        id: gate
        continue-on-error: true
        env:
          FINTRACE_LLM_MODE: replay
          RETRIEVAL_TIER: bm25
          LLM_API_KEY: replay-only
        run: uv run python -m scripts.eval_gate

      - name: Comment eval gate on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        with:
          script: |
            const fs = require('fs');
            let body = '### FinTrace eval gate\n\n门禁没有产出报告（步骤未运行）。';
            try { body = fs.readFileSync('gate.md', 'utf8'); } catch (e) {}
            body += `\n\n<sub>job: ${process.env.GATE_OUTCOME}</sub>`;
            const marker = '<!-- fintrace-eval-gate -->';
            body = marker + '\n' + body;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if gate blocked
        if: steps.gate.outcome == 'failure'
        run: exit 1

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            reports/
            gate.md
          if-no-files-found: warn
