services:
  db:
    image: pgvector/pgvector:pg17
    container_name: fintrace-db
    environment:
      POSTGRES_USER: fintrace
      POSTGRES_PASSWORD: fintrace
      POSTGRES_DB: fintrace
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrace -d fintrace"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
