[project]
name = "fintrace"
version = "0.1.0"
description = "Auditable financial research agent: every claim cited, every number recomputable."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.162.5",
    "httpx>=0.27.2",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "lxml>=5.3.0",
    "mcp>=1.0",
    "psycopg[binary,pool]>=3.2.3",
    "pydantic>=2.9.2",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "rich>=13.9.2",
    "typer>=0.12.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11.2",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.1",
    "streamlit>=1.66.1",
    "types-python-dateutil>=2.9.0.20240906",
    "types-pyyaml>=6.0.12.20240917",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"eval/check.py" = ["B008"]
"eval/runner.py" = ["B008"]
"pipelines/ingest.py" = ["B008"]
"pipelines/universe.py" = ["B008"]
"scripts/eval_gate.py" = ["B008"]
"scripts/loadtest.py" = ["B008"]
"scripts/compare_agents.py" = ["B008"]
"scripts/tool_selection_eval.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["agent", "pipelines", "eval", "api", "mcp_server"]

[[tool.mypy.overrides]]
module = ["bs4.*", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "live: requires network access",
    "replay: uses recorded LLM cassettes (offline)",
]

[tool.coverage.run]
source = ["agent", "pipelines", "eval"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", 'raise NotImplementedError']
